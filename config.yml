computers:
    tigu:
        ssh_help: tigu
        ssh_host: tigu
        ssh_dependencies: [ela.cscs.ch]
        grants:
            - free
        setup:
            append_text: ''
            default_memory_per_machine: 125829120
            description: Tigu computer at Empa.
            hostname: 10.128.1.11
            label: tigu_{grant}
            mpiprocs_per_machine: 12
            mpirun_command: srun
            prepend_text: |
                export OMP_NUM_THREADS=${SLURM_CPUS_PER_TASK:-1}
                ulimit -s unlimited
            scheduler: core.slurm
            shebang: '#!/bin/bash -l'
            transport: core.ssh
            use_double_quotes: false
            work_dir: /scratch/{username}/aiida/
        config:
            allow_agent: true
            compress: true
            gss_auth: false
            gss_deleg_creds: false
            gss_host: 10.128.1.11
            gss_kex: false
            key_filename: /home/jovyan/.ssh/cscs-key
            key_policy: RejectPolicy
            load_system_host_keys: true
            look_for_keys: true
            port: 22
            proxy_command: ssh -oBatchMode=yes -oStrictHostKeyChecking=yes -oConnectTimeout=20 -W 10.128.1.11:22 -oProxyCommand="ssh -oBatchMode=yes -oStrictHostKeyChecking=yes
                -oConnectTimeout=20 -o 'ForwardAgent yes' ela.cscs.ch 'ssh-add -t 5 {tigu_ela_key} && nc jump1.empa.ch 22'" {tigu_empa_username}@jump1.empa.ch
            proxy_jump: ''
            safe_interval: 30.0
            timeout: 60
            use_login_shell: true
            username: '{tigu_empa_username}'
    daint.alps:
        ssh_help: alps
        grants:
            - lp168
            - lp83
            - lp86
        setup:
            description: daint.alps at CSCS
            hostname: daint.alps.cscs.ch
            label: daint.alps_{grant}
            mpiprocs_per_machine: 256
            mpirun_command: srun --cpu-bind=socket /users/{cscsuser}/bin/mps-wrapper.sh
            prepend_text: |
                #SBATCH --hint=nomultithread
                #SBATCH --no-requeue
                #SBATCH --account={grant}
            scheduler: core.slurm
            shebang: '#!/bin/bash -l'
            transport: core.ssh
            use_double_quotes: false
            work_dir: /ritom/scratch/cscs/{username}/aiida/
            default_memory_per_machine: 268435456
        config:
            allow_agent: true
            compress: true
            gss_auth: false
            gss_deleg_creds: false
            gss_host: daint.alps.cscs.ch
            gss_kex: false
            key_filename: /home/jovyan/.ssh/cscs-key
            key_policy: RejectPolicy
            load_system_host_keys: true
            look_for_keys: true
            port: 22
            proxy_command: ''
            proxy_jump: ela.cscs.ch
            safe_interval: 30.0
            timeout: 60
            use_login_shell: true
            username: '{cscsuser}'
    eiger.alps:
        ssh_help: alps
        grants:
            - mr34
            - mr33
        setup:
            description: eiger.alps at CSCS
            hostname: eiger.alps.cscs.ch
            label: eiger.alps_{grant}
            mpiprocs_per_machine: 64
            mpirun_command: srun --cpu-bind=socket
            prepend_text: |
                #SBATCH --hint=nomultithread
                #SBATCH --no-requeue
                #SBATCH --account={grant}
            scheduler: core.slurm
            shebang: '#!/bin/bash -l'
            transport: core.ssh
            use_double_quotes: false
            work_dir: /ritom/scratch/cscs/{username}/aiida/
            default_memory_per_machine: 268435456
        config:
            allow_agent: true
            compress: true
            gss_auth: false
            gss_deleg_creds: false
            gss_host: eiger.alps.cscs.ch
            gss_kex: false
            key_filename: /home/jovyan/.ssh/cscs-key
            key_policy: RejectPolicy
            load_system_host_keys: true
            look_for_keys: true
            port: 22
            proxy_command: ''
            proxy_jump: ela.cscs.ch
            safe_interval: 30.0
            timeout: 60
            use_login_shell: true
            username: '{cscsuser}'

# SSH Configuration from 'config' File
ssh_config:
    daint.alps.cscs.ch:
        hostname: daint.alps.cscs.ch
        user: '{cscsuser}'
        port: 22
        proxy_jump: ela.cscs.ch
        identity_file: /home/jovyan/.ssh/cscs-key
        server_alive_interval: 5
    eiger.alps.cscs.ch:
        hostname: eiger.alps.cscs.ch
        user: '{cscsuser}'
        port: 22
        proxy_jump: ela.cscs.ch
        identity_file: /home/jovyan/.ssh/cscs-key
        server_alive_interval: 5
    ela.cscs.ch:
        hostname: ela.cscs.ch
        user: '{cscsuser}'
        port: 22
        identity_file: /home/jovyan/.ssh/cscs-key
    tigu:
        hostname: 10.128.1.11
        user: '{tigu_empa_username}'
        port: 22
        proxy_command: ssh -oBatchMode=yes -oStrictHostKeyChecking=yes -oConnectTimeout=20 -W 10.128.1.11:22 -oProxyCommand="ssh -oBatchMode=yes -oStrictHostKeyChecking=yes
            -oConnectTimeout=20 -o 'ForwardAgent yes' ela.cscs.ch 'ssh-add -t 5 {tigu_ela_key} && nc jump1.empa.ch 22'" {tigu_empa_username}@jump1.empa.ch
        identity_file: /home/jovyan/.ssh/cscs-key
        server_alive_interval: 5


# Computational Tools
codes:
    gaussian:
        append_text: ' '
        computer: tigu
        default_calc_job_plugin: gaussian
        description: Gaussian 16
        filepath_executable: /opt/g16_avx2/g16
        label: gaussian-16
        prepend_text: ' '
        use_double_quotes: false
    stm:
        append_text: ' '
        computer: daint.alps
        default_calc_job_plugin: nanotech_empa.stm
        description: Modern SPM source a0e486a in the selected shared Daint uenv
        filepath_executable: /user-environment/native/spm/bin/cp2k-stm-sts-wfn
        label: stm-{spm_version}
        prepend_text: "#SBATCH --uenv={spm_uenv}\n#SBATCH --view=default\n# set environment\nexport OMP_NUM_THREADS=$(( SLURM_CPUS_PER_TASK > 1 ? SLURM_CPUS_PER_TASK\
            \ - 1 : 1 ))\nexport MPICH_GPU_SUPPORT_ENABLED=0\nulimit -s unlimited\nexport LD_LIBRARY_PATH=/user-environment/env/default/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\n\
            export PYTHONNOUSERSITE=1\n"
        use_double_quotes: false
    ppafm:
        append_text: ' '
        computer: daint.alps
        default_calc_job_plugin: nanotech_empa.afm
        description: afm {afm_uenv} on daint.alps from https://github.com/Probe-Particle/ppafm.git
        filepath_executable: /user-environment/native/support/bin/run_ppafm.sh
        label: ppafm-{afm_version}
        prepend_text: "#SBATCH --uenv={support_uenv}\n#SBATCH --view=default\nexport OMP_NUM_THREADS=1\nexport OPENBLAS_NUM_THREADS=1\nexport MKL_NUM_THREADS=1\n\
            export MPICH_GPU_SUPPORT_ENABLED=0\n"
        use_double_quotes: false
        with_mpi: false
    python:
        append_text: ' '
        computer: daint.alps
        default_calc_job_plugin: pythonjob.pythonjob
        description: Python3.12 QE-PP worker in shared EMPA postprocessing uenv
        filepath_executable: /user-environment/native/python-worker/bin/python
        label: python
        prepend_text: "#SBATCH --uenv={python_uenv}\n#SBATCH --view=default\nexport MPICH_GPU_SUPPORT_ENABLED=0\n"
        use_double_quotes: false
        with_mpi: false
        runtime_checks:
            - arguments:
                  - /user-environment/native/python-worker/bin/python
                  - -c
                  - import cloudpickle,numpy,scipy; from pymatgen.io.common import VolumetricData; from skimage.transform import resize; from skimage.metrics
                    import structural_similarity; print('qe-pp-python-ready')
              contains: qe-pp-python-ready
