setup_tasks:
    daint_directories:
        computer: daint.alps
        commands:
            - type: ssh
              command: mkdir -p /users/{cscsuser}/bin && mkdir -p /users/{cscsuser}/src
    daint_mps_wrapper:
        computer: daint.alps
        commands:
            - type: scp
              command: scp {config_files}/mps-wrapper.sh {remotehost1}:/users/{cscsuser}/bin/
    cp2k_data:
        computer: daint.alps
        codes:
            - cp2k
        commands:
            - type: scp
              command: scp -r {config_files}/cp2k {remotehost1}:/users/{cscsuser}/src/
