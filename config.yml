---
schema_version: 4
includes: [runtime-catalog.yml, connection-help.yml]
variables:
    remotehost1: daint.alps.cscs.ch
    conda_init: source /users/{cscsuser}/miniconda3/bin/activate
    config_files: /home/jovyan/opt/aiidalab-alps-files/
    qe_uenv: quantumespresso/v7.5:v3
    qe_version: '7.5'
    qeeiger_uenv: quantumespresso/v7.4.1:v2
    qeeiger_version: '7.4'
    wannier90_version: 3.1.0
    wannier90_uenv: quantumespresso/v7.5:v3
    cp2keiger_uenv: cp2k/2025.1:v3
    cp2keiger_version: '2025.1'
    cp2k_uenv: cp2k/2026.2:v1
    cp2k_version: '2026.2'
    spmeiger_uenv: cp2k-spm-tools/1.5:1991541844
    spmeiger_version: 1.5.0
    spm_uenv: empa-spm-native/1.6.0-a0e486a:3077571942
    spm_version: 1.6.0-a0e486a
    unfolding_source_ref: a0e486a12ad0102c6af5f9a9572c2449ec26e81e
    unfolding_version: 1.6.0-a0e486a
    spm_current_preview_source_ref: a0e486a12ad0102c6af5f9a9572c2449ec26e81e
    spm_current_preview_version: surfaces-v2-a0e486a
    bader_version: '1.05'
    afm_uenv: '{support_uenv}'
    afm_version: 0.4.1
    cubehandler_uenv: empa-render/0.2.1-245db38:3075642343
    cubehandler_version: 0.2.1-245db38
    python_uenv: empa-postprocess/2026.11:3075642218
    python_version: '3.12'
    phonopy_uenv: critic2/1.2:1952527021
    phonopy_version: 2.25.0
    critic2_uenv: '{support_uenv}'
    critic2_version: '1.6'
    ssh_public_key: /home/jovyan/.ssh/cscs-key-cert.pub
    timestamp: now

    support_uenv: empa-support/2026.11-native:3077565151
widgets:
    cscsuser:
