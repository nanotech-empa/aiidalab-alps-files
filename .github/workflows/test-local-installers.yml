---
name: Local runtime recipe contracts
on:
    pull_request:
    push:
        branches: [main]
jobs:
    contracts:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - run: python -m pip install pytest pyyaml
            - name: Test plans, hashes, isolation and failure receipts
              env:
                  AIIDA_PATH: ${{ runner.temp }}/installer-test-state
                  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
              run: python -m pytest -q tests
