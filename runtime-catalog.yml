---
# Optional runtime definitions; no quantum-worker installations or updates.
variables:
    tigu_empa_username: '{cscsuser}'
    tigu_ela_key: ''
    local_orca_root: /home/jovyan/opt/orca_6_1_1_linux_arm64_shared_openmpi418
    local_orca_mpi: /home/jovyan/opt/openmpi-4.1.8-orca-fortran
    local_python: /opt/conda/bin/python
    local_spm_bin: /home/jovyan/.local/bin
    local_banduppy_python: /home/jovyan/opt/banduppy-1.0.0/bin/python
    tigu_orca_root: /store/amsp/ORCA_6_1_1
    tigu_orca_mpi: /opt/openmpi-4.1.1
    tigu_banduppy_python: /store/{tigu_empa_username}/opt/banduppy-1.0.0/bin/python
    daint_banduppy_python: /users/{cscsuser}/opt/banduppy-1.0.0/bin/python
    local_cp2k_executable: /home/jovyan/opt/cp2k-2023.1-debian-arm64/usr/bin/cp2k.psmp
    local_cp2k_prefix: /home/jovyan/opt/cp2k-2023.1-debian-arm64/usr
    local_support_prefix: /home/jovyan/opt/local-codes
    local_qe_prefix: /home/jovyan/.conda/envs/quantum-espresso-7.4
    tigu_python: /store/{tigu_empa_username}/opt/cpython-3.12.15-20261013/python/bin/python3.12
    tigu_orca_helpers: /store/{tigu_empa_username}/opt/orca-dyson-20261021
runtime_settings:
    tigu_empa_username:
        description: Empa/Tigu username
        format: ssh_username
        computers: [tigu]
    tigu_ela_key:
        description: Tigu key on ELA (blank = defaults)
        format: ssh_key_path
        computers: [tigu]
    local_orca_root:
        description: local orca root
        deployments:
            - personal
    local_orca_mpi:
        description: local orca mpi
        deployments:
            - personal
    local_python:
        description: local python
        deployments:
            - personal
    local_spm_bin:
        description: local spm bin
        deployments:
            - personal
    local_banduppy_python:
        description: local banduppy python
        deployments:
            - personal
    tigu_orca_root:
        description: tigu orca root
        deployments:
            - hosted
            - personal
    tigu_orca_mpi:
        description: tigu orca mpi
        deployments:
            - hosted
            - personal
    tigu_banduppy_python:
        description: tigu banduppy python
        deployments:
            - hosted
            - personal
    daint_banduppy_python:
        description: daint banduppy python
        deployments:
            - hosted
            - personal
    local_cp2k_executable:
        description: local cp2k executable
        deployments:
            - personal
    local_cp2k_prefix:
        description: local cp2k prefix
        deployments:
            - personal
    local_support_prefix:
        description: local support prefix
        deployments:
            - personal
    local_qe_prefix:
        description: local qe prefix
        deployments:
            - personal
    tigu_python:
        description: Tigu native Python >=3.11
        deployments:
            - hosted
            - personal
    tigu_orca_helpers:
        description: Tigu ORCA helper prefix
        deployments:
            - hosted
            - personal
computers:
    mac-localhost:
        deployments:
            - personal
        setup:
            label: localhost
            hostname: localhost
            description: Personal Docker container (Linux, on the personal computer)
            transport: core.local
            scheduler: core.direct
            shebang: '#!/bin/bash'
            work_dir: /home/jovyan/aiida_run
            mpirun_command: mpirun -np {tot_num_mpiprocs}
            mpiprocs_per_machine: 1
            default_memory_per_machine: 1048576
            prepend_text: ''
            use_double_quotes: false
        config: {}
codes:
    tigu_orca:
        computer: tigu
        label: orca-6.1.1
        description: orca-6.1.1 on tigu
        filepath_executable: '{tigu_orca_root}/orca'
        default_calc_job_plugin: orca.orca
        prepend_text: "export PATH=\"{tigu_orca_mpi}/bin:{tigu_orca_root}:$PATH\"\nexport LD_LIBRARY_PATH=\"{tigu_orca_mpi}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"\
            \nexport OMP_NUM_THREADS=1\nexport OPENBLAS_NUM_THREADS=1\nexport MKL_NUM_THREADS=1\n"
        append_text: ''
        use_double_quotes: false
        install_help: See docs/runtime-installation.md. Supply the licensed native ORCA distribution and matching MPI before registration.
        with_mpi: false
        runtime_checks:
            - arguments:
                  - ldd
                  - '{tigu_orca_root}/orca'
              not_contains: not found
    tigu_orca_plot:
        computer: tigu
        label: orca-plot-6.1.1
