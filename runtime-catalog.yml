setup_tasks:
    local_banduppy_runtime:
        computer: mac-localhost
        codes:
            - local_banduppy
        commands:
            - type: local
              command: '{local_python} {config_files}/scripts/install-banduppy-runtime.py --executable {local_banduppy_python}'
    daint_banduppy_runtime:
        computer: daint.alps
        codes:
            - daint_banduppy
        commands:
            - type: scp
              command: scp {config_files}/scripts/install-banduppy-runtime.py daint.alps.cscs.ch:/users/{cscsuser}/bin/empa-install-banduppy.py
            - type: ssh
              command: uenv run --view=default {spm_uenv} -- python /users/{cscsuser}/bin/empa-install-banduppy.py --executable {daint_banduppy_python}
    tigu_banduppy_runtime:
        computer: tigu
        codes:
            - tigu_banduppy
        commands:
            - type: ssh
              command: mkdir -p /store/{tigu_empa_username}/opt/empa-setup
            - type: scp
              command: scp {config_files}/scripts/install-banduppy-runtime.py tigu:/store/{tigu_empa_username}/opt/empa-setup/install-banduppy-runtime.py
            - type: ssh
              command: '{tigu_python} /store/{tigu_empa_username}/opt/empa-setup/install-banduppy-runtime.py --executable {tigu_banduppy_python}'
    eiger_cp2k_data:
        computer: eiger.alps
        codes:
            - cp2keiger
        commands:
            - type: ssh
              command: mkdir -p /users/{cscsuser}/src
            - type: scp
              command: scp -r {config_files}/cp2k eiger.alps.cscs.ch:/users/{cscsuser}/src/
