computers:
    mac-localhost:
        display_name: Localhost
        deployments:
            - personal
        setup:
            label: localhost
            hostname: localhost
            description: Personal Docker container (Linux, on the personal computer)
            transport: core.local
            scheduler: core.direct
            shebang: '#!/bin/bash'
            work_dir: /home/jovyan/aiida_run
            mpirun_command: mpirun -np {tot_num_mpiprocs}
            mpiprocs_per_machine: '{local_default_mpi}'
            default_memory_per_machine: '{local_memory_kib}'
            prepend_text: ''
            use_double_quotes: false
        config: {}
    tigu-modules:
        display_name: Tigu
        ssh_help: tigu
        ssh_host: tigu
        ssh_dependencies:
            - ela.cscs.ch
        grants:
            - free
        setup:
            append_text: ''
            default_memory_per_machine: 125829120
            description: Tigu versioned EMPA modules (separate from existing Computer)
            hostname: 10.128.1.11
            label: tigu-modules_{grant}
            mpiprocs_per_machine: 12
            mpirun_command: mpirun -np {tot_num_mpiprocs}
            prepend_text: "export OMP_NUM_THREADS=${SLURM_CPUS_PER_TASK:-1}\nulimit -s unlimited\n"
            scheduler: core.slurm
            shebang: '#!/bin/bash -l'
            transport: core.ssh_async
            use_double_quotes: false
            work_dir: /scratch/{username}/aiida/
        config:
            host: tigu
            backend: openssh
            safe_interval: 30.0
            max_io_allowed: 8
            authentication_script: None
            use_login_shell: true
